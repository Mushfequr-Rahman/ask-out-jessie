<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jessie, dinner?</title>
    <meta
      name="description"
      content="A cute invitation for Jessie to pick a time for a date night."
    >
    <link rel="preload" as="image" href="assets/cute-hero.png">
    <link rel="stylesheet" href="styles.css?v=5">
  </head>
  <body class="landing-page">
    <main class="landing-shell" aria-labelledby="hero-title">
      <img class="landing-image" src="assets/cute-hero.png" alt="">
      <div class="landing-glow"></div>

      <section class="invite-card">
        
        <h1 id="hero-title">Jessie, will you go out with me?</h1>
        <p class="lead">
          I had a greatime last time and I was thinking we could go out again; A little surprise,
          lots of new food, and fun drinks afterwards!
        </p>

        <div class="choice-panel" aria-label="Date invitation choices">
          <a class="button button--yes" href="booking.html">Yes</a>
          <button class="button button--no" id="noButton" type="button">No</button>
        </div>
      </section>
    </main>

    <script src="script.js?v=5"></script>
  </body>
